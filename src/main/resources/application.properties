# TOMCAT

server.port=${PORT:8080}
server.tomcat.max-threads=4
server.tomcat.min-spare-threads=2


# SPRING

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true
# spring.main.lazy-initialization=true


# SPRING AI

    # OPEN AI

    # GOOGLE (GEMINI)

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
# spring.ai.google.genai.chat.options.model=gemini-2.0-flash
spring.ai.gemini.chat.options.model=gemini-1.5-flash
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.embedding.options.model=text-embedding-004
spring.ai.google.genai.embedding.text.options.dimensions=768


# HIBERNATE

# spring.jpa.hibernate.ddl-auto=update
spring.jpa.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none

spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximumPoolSize=6
spring.datasource.hikari.minimumIdle=3
spring.datasource.hikari.idleTimeout=100000

